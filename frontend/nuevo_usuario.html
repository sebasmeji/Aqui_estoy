<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Usuario</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="icon" href="" type="image/svg+xml">
    <link rel="stylesheet" href="/frontend/styles/nuevo_usuario.css">
</head>

<body>
    <div class="login">

        <div class="form-container">
            <h1 class="title">Nuevo Usuario</h1>

            <form action="/" class="form">
                <input type="text" id="name" placeholder="Nombre" class="input input-name" required>

                <input type="text" id="last-name" placeholder="Apellido" class="input input-last-name" required>

                <input type="email" id="email" placeholder="Correo" class="input input-email" required>

                <input type="password" id="password" placeholder="Contraseña" class="input input-password" required>

                <input type="password" id="confirm-password" placeholder="Confirmar Contraseña" class="input input-confirm-password" required>
            </form>
            
            <input type="submit" value="Iniciar sesión" class="create-button primary-button">
        </div>
    </div>
</body>

</html>
