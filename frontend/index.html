<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Password</title>
    <link rel="icon" href="/imagenes/logos/favicon_yard_sale.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/frontend/styles/styles_index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin> 
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="contenedor_login">
        <div class="form-container">
            <img src="/imagenes/logos/logo_yard_sale.svg" alt="Logo principal" class="logo">
            <h1 class="title">Create a new password</h1>
            <p>Enter a new password for your account</p>

            <form action="/" class="form">
                <label for="password" class="label">Password</label>
                <input type="password" id="password" placeholder="*********" class="input input-password" required>

                <label for="newPassword" class="label">New Password</label>
                <input type="password" id="newPassword" placeholder="*********" class="input input-newPassword"
                    required>

                <input type="submit" value="Confirm" class="primary-button login-button">
            </form>
        </div>
    </div>
</body>
</html>
